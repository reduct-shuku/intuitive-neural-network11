<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>intuitive-neural-network11</title><style>
  *{box-sizing:border-box}body{margin:0;padding:36px;color:#203b32;background:#f5f7f1;font:16px/1.75 "Microsoft YaHei",sans-serif}main{max-width:670px;margin:auto}small{font-size:12px;letter-spacing:2px;color:#64766d}h1{font:500 30px/1.45 "Microsoft YaHei",sans-serif;margin:12px 0 22px}h2{font-size:19px;font-weight:500}section{background:white;border:1px solid #dce4d8;border-radius:16px;padding:28px;margin:22px 0}label{display:block;margin:14px 0 0}output{float:right;font-variant-numeric:tabular-nums}input{width:100%;accent-color:#326848}.network{display:flex;align-items:center;justify-content:space-between;text-align:center;margin-bottom:30px;gap:12px}.network span{min-width:70px}.network b{font-size:26px}i{color:#8b9c88;font-style:normal}.node{border:2px solid #4b8052;border-radius:50%;padding:13px;font-size:30px}.meter{height:8px;border-radius:8px;background:#ecf0e8;margin-top:24px}.meter div{height:100%;background:#659754;border-radius:8px}.hint{font-size:14px;color:#6e7b71}button{border:0;border-radius:7px;padding:11px 16px;background:#2f5945;color:white;font:inherit;cursor:pointer}.sample{padding:32px;background:#f3f2e9;border-radius:10px;margin-top:20px}.sample h3{margin:12px 0}.sample p{color:#677366}.commits{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.commits span{border:1px solid #a0b28f;padding:10px;border-radius:20px;background:#f1f5e9}@media(max-width:480px){body{padding:20px}section{padding:20px}.network{gap:4px}.network span{min-width:48px}h1{font-size:24px}}@media(prefers-reduced-motion:no-preference){.meter div{transition:width .15s}}
  </style></head><body><main><small>SHUKU · INTERACTIVE LESSON / V1.0</small><h1>intuitive-neural-network11</h1><h2>认识输入、权重与输出</h2><section><div class="network"><span>输入<br><b>0.80</b></span><i>× w + b</i><span class="node">σ</span><i>→</i><span>输出<br><b id="prediction">0.69</b></span></div><label for="weight">权重 w <output id="wv">1.0</output></label><input id="weight" type="range" min="-3" max="3" step="0.1" value="1"><label for="bias">偏置 b <output id="bv">0.0</output></label><input id="bias" type="range" min="-2" max="2" step="0.1" value="0"><div class="meter"><div id="meter"></div></div><p class="hint">拖动滑块，观察 σ(0.8 × w + b) 的变化。输出越接近 1，神经元越倾向于被激活。</p></section><p class="hint">这是可信预置的交互课程样例。发布内容以快照保存，修改后可在新版本中看到变化。</p></main><script nonce="course-template">function update(){const w=Number(document.querySelector('#weight').value),b=Number(document.querySelector('#bias').value),p=1/(1+Math.exp(-(0.8*w+b)));document.querySelector('#wv').textContent=w.toFixed(1);document.querySelector('#bv').textContent=b.toFixed(1);document.querySelector('#prediction').textContent=p.toFixed(2);document.querySelector('#meter').style.width=(p*100)+'%'}document.querySelector('#weight').oninput=update;document.querySelector('#bias').oninput=update;update();</script></body></html>
